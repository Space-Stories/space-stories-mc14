- type: entity
  parent: RMCCrateWoodenBuildable
  id: RMCCrateBlackMarketMiscSecuredWildlife
  name: secured wildlife container
  description: Contains one secured wildlife specimen.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Storage/Crates/lisacrate.rsi
    layers:
    - state: base
      map: ["enum.StorageVisualLayers.Base"]
    - state: closed
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      sprite: _RMC14/Structures/Storage/Crates/woodcrate.rsi
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: invoice
      sprite: _RMC14/Structures/Storage/Crates/labels.rsi
      visible: false
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: Icon
    sprite: _RMC14/Structures/Storage/Crates/lisacrate.rsi
    state: closed
  - type: EntityStorageVisuals
