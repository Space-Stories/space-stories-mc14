- type: job
  parent: CMSurvivor
  id: RMCSyntheticColony
  name: rmc-job-name-synth-colony
  description: rmc-job-description-synth-colony
  playTimeTracker: RMCJobSyntheticColony
  ranks:
    RMCRankSyntheticColonist: []
  startingGear: RMCGearSyntheticColonist
  icon: "RMCJobIconSynth"
  joinNotifyCrew: true
  whitelisted: true
  whitelistParent: RMCJobSynthetic
  supervisors: cm-job-supervisors-colonists
  accessGroups:
  - Colony # Colony All Access
  - ColonistSynthShipside # Med, Engi, Synth
  roleWeight: 0.25
  basePlaytimeTracker: true
  # Stories-SurvivorSpawnerFallback-Start
  survivorSpawnerFallback:
  - RMCSurvivorShivasPanicRoomResearcher
  - RMCSurvivorShivasPanicRoomEngineer
  - RMCSurvivorShivasPanicRoomDoctor
  - RMCSurvivorShivasPanicRoomCivilian
  # Stories-SurvivorSpawnerFallback-End
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      preset: RMCLanguagePresetSynthColonist
    - type: LanguageLearning
      preset: RMCLanguageLearningPresetSynthColonist
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: synth
    - type: NpcFactionMember
      factions:
      - Civilian
    - type: IntelRescueSurvivorObjective
    - type: RMCSurvivor
    - type: MotionDetectorTracked
    # Stories-Synth-Start
    - type: SynthGeneration
      generation: RMCSynthGenTwo
      selectable: false
    # Stories-Synth-End
    - type: Synth
  hidden: false # Stories-SynthSurvivor
  useLoadoutOfJob: RMCSyntheticColony # for inheritance

- type: startingGear
  id: RMCGearSyntheticColonistBase
  equipment:
    id: RMCIDCardSynthColony
    ears: CMHeadsetColony
    belt: CMBeltUtilityFilled
    pocket1: RMCPouchSurvivalSynthFill
    pocket2: RMCPouchToolsFill

- type: startingGear
  parent: RMCGearSyntheticColonistBase
  id: RMCGearSyntheticColonist
  equipment:
    jumpsuit: RMCJumpsuitSynthetic
    gloves: CMHandsInsulated
    shoes: CMBootsBlackFilled

- type: entity
  parent: CMSpawnPointJobBase
  id: RMCSpawnPointSynthColonist
  name: synthetic colonist spawn point
  components:
  - type: SpawnPoint
    job_id: RMCSyntheticColony
  - type: Sprite
    state: syn_spawn

- type: playTimeTracker
  id: RMCJobSyntheticColony
  name: rmc-playtime-tracker-job-name-survivor-synth
  isHumanoid: true
