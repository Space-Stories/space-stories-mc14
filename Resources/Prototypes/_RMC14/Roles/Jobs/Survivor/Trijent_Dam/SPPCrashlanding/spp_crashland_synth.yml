- type: job
  parent: RMCSurvivorSPPCrashlandBase
  id: RMCSurvivorSPPCrashlandSynth
  name: rmc-job-name-crashland-synth
  startingGear: RMCGearSPPCrashlandSynth
  ranks:
    RMCRankSyntheticColonist: []
  icon: "RMCJobIconSPPSynth"
  spawnMenuRoleName: SPP Airborne Synthetic (Trijent Special Survivor)
  # Stories-SurvivorSpawnerFallback-Start
  survivorSpawnerFallback:
  - RMCSurvivorSPPCrashlandSoldier
  # Stories-SurvivorSpawnerFallback-End
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      preset: RMCLanguagePresetSynthColonist
    - type: LanguageLearning
      preset: RMCLanguageLearningPresetSynthColonist
    - type: NpcFactionMember
      factions:
      - SPP
    - type: IntelRescueSurvivorObjective
    - type: AssignSquad
      squad: SquadSPP
    - type: JobPrefix
      prefix: rmc-job-prefix-crashland-synth
    - type: RMCSurvivor
    # Stories-Synth-Start
    - type: SynthGeneration
      generation: RMCSynthGenThree
      selectable: false
    # Stories-Synth-End
    - type: Synth
  hidden: true

- type: startingGear
  parent: RMCGearSPPCrashlandBase
  id: RMCGearSPPCrashlandSynth
  equipment:
    jumpsuit: STJumpsuitSPPCrashlandSynth # Stories-SynthSurvivorGear
    belt: RMCBeltMedicBagSPP
    outerClothing: RMCOuterClothingExternalWebbingSPPSurvivor
    head: CMHeadCapSPPBeret
    back: RMCSatchelSPP
    suitstorage: RMCFlashlight
    pocket1: RMCPouchToolsSocFilledSPPSynthetic
    pocket2: RMCPouchSurvivalSynthFill
  storage:
    back:
    - CMSheetMetal20
    - CMRollerBedSpawnFolded
    - CMMultitool
    - RMCCableCoil
    - CMHealthAnalyzer
    - RMCSynthResetKeyNovaris
    - RMCRadioHandheldColony # Stories-SynthSurvivorGear
    belt:
    - CMUpgradedTraumaKit10
    - CMUpgradedTraumaKit10
    - CMUpgradedBurnKit10
    - CMUpgradedBurnKit10
    # - RMCSplint
    # - RMCHyposprayOxycodone
    - CMPillCanisterBicaridine
    - CMPillCanisterKelotane
    - CMPillCanisterInaprovaline

- type: entity
  parent: CMSpawnPointJobBase
  id: CMSpawnPointSPPCrashlandSynth
  name: special survivor spp crashland synth spawn point
  components:
  - type: SpawnPoint
    job_id: RMCSurvivorSPPCrashlandSynth
  - type: Sprite
    layers:
    - sprite: _RMC14/Markers/landmarks.rsi
      state: surv_spp
