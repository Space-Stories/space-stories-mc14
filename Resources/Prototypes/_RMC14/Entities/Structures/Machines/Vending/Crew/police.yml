# MILITARY POLICE

- type: entity
  parent: ColMarTechBase
  id: ColMarTechMilitaryPoliceEquipment
  name: ASRS military police equipment rack
  description: An automated rack hooked up to a colossal storage of Military Police standard-issue equipment.
  components:
  - type: AccessReader
    access:
    - [ "CMAccessBrig" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/clothing.rsi
  - type: CMAutomatedVendor
    jobs:
    - CMMilitaryPolice
    sections:
    - name: Полицейский Набор (обязательно)
      takeAll: RMCMPSet
      entries:
      - id: RMCVendorBundleMilitaryPoliceApparel
    - name: Стандартное Оборудование
      takeAll: CMStandard
      entries:
#      - id: CMHandsBlackMarine (Everything marked as a comment is redundant, since the role already spawns with that item. The lines were not deleted, in case they need to be re-added later.)
      - id: CMHeadsetMPO
#      - id: CMJumpsuitMP
#      - id: CMBootsBlackFilled
#      - id: CMBeltSecurityMPFilled
      - id: CMGlassesSecurity
      - id: RMCVisorMedical
    - name: Helmet
      choices: { CMHelmet: 1 }
      entries:
      - id: CMArmorHelmetM10MP
    - name: Armor
      choices: { CMArmor: 1 }
      entries:
      - id: CMArmorM2MP
      - id: RMCArmorVestMP
#    - name: Hat
#      choices: { CMHat: 1 }
#      entries:
#      - id: CMHeadBeretRed
    - name: Кейс Для Пистолета
      choices: { CMGunCase: 1 }
      entries:
      - id: RMCGunCasePistolM77
      - id: RMCGunCasePistolM44
      - id: RMCGunCasePistolM1984
#    - name: Рюкзак
#      choices: { CMBackpack: 1 }
#      entries:
#      - id: CMSatchelSecurity
    - name: Пояс
      choices: { CMBelt: 1 }
      entries:
      - id: RMCBeltHolsterPistol
      - id: RMCBeltHolsterRevolver
      - id: RMCBeltUtilityGeneral
    - name: Подсумки
      choices: { RMCPouch: 2 }
      entries:
      - id: RMCPouchGeneralMedium
      - id: RMCPouchFirstAidInjectors
        name: подсумок первой помощи (многоразовые инъекторы)
        recommended: true
      - id: RMCPouchFirstAidSplintsGauzeOintment
        name: подсумок первой помощи (марля, мазь) # TODO RMC14 add 'splints,'
        recommended: true
      - id: RMCPouchFirstAidPills
        name: подсумок первой помощи (таблетки)
        recommended: true
      - id: RMCPouchMagazinePistol
      - id: RMCPouchPistol
    - name: Маска
      choices: { CMMask: 1 }
      entries:
      - id: CMMaskGas
      - id: CMMaskCoif
      - id: RMCMaskRebreather
    - name: Аксессуары
      choices: { CMAccessories: 1 }
      entries:
      - id: CMWebbingBrown
        recommended: true
      - id: CMWebbingBlack
        recommended: true
      - id: RMCWebbingLegPouch
      - id: RMCWebbingLegPouchBlack
      - id: RMCWebbingDropPouch
      - id: RMCWebbingDropPouchBlack
      - id: CMWebbingHolster
      - id: RMCWebbingHolsterBlack
      - id: CMWebbing
      - id: RMCWebbingBlackSmall
    - name: Books
      entries:
      - id: RMCGuidebookLawMarine
        amount: 10
      - id: RMCGuidebookSOP
        amount: 10
        
