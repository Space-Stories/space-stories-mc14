- type: entity
  parent: CMComputerDropship
  id: RMCComputerDropshipRemoteControl
  name: dropship navigation computer
  description: A remote flight computer that can be used to direct linked dropships and configure automated routes.
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/dropship_nav_computer.rsi
    layers:
    - map: ["base"]
      state: off
    - map: ["enum.PowerDeviceVisualLayers.Powered"]
      state: "on"
  - type: Appearance
  - type: GuideHelp
    guides:
    - RMCGuideRoleCAS
  - type: ActivatableUI
    key: enum.DropshipRemoteControlUiKey.Key
  - type: AccessReader
    access: [["CMAccessDropship"], ["CMAccessSquadLeaderPrep"], ["RMCAccessSeniorCommand"], ["CMAccessXeno"]] # Xeno have access as to not cause the "Access denied!" popup.
  - type: ActivatableUIRequiresAccess
  - type: DropshipRemoteControlConsole
  - type: UserInterface
    interfaces:
      enum.DropshipRemoteControlUiKey.Key:
        type: DropshipRemoteControlBui
