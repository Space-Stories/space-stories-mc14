- type: entity
  abstract: true
  parent: CMBaseStructure
  id: RMCPropComputerBase
  name: terminal
  description: This can be used for various functions.
  suffix: Prop
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _RMC14/Structures/Machines/computer.rsi
    layers:
    - state: "terminal0"
    - map: ["enum.PowerDeviceVisualLayers.Powered"]
      state: "terminal"
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: ApcPowerReceiver
    powerLoad: 250
    needsPower: true
  - type: RMCPowerReceiver
    # CM13 /obj/structure/machinery/prop/almayer/computer.
    idleLoad: 20
    activeLoad: 0
    channel: Equipment
  - type: Clickable
  - type: Corrodible
    isCorrodible: false
  - type: InteractionOutline
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: InteractedBlacklist
    blacklist:
      components:
      - Xeno
  - type: WallMount
    arc: 360

- type: entity
  parent: RMCPropComputerBase
  id: RMCPropCommunicationsConsole
  name: communications console
  components:
  - type: Sprite
    state: comm
    layers:
    - state: "comm0"
    - map: ["enum.PowerDeviceVisualLayers.Powered"]
      state: "comm"

- type: entity
  parent: RMCPropCommunicationsConsole
  id: RMCPropCommunicationsConsoleAlt
  suffix: Prop, Alt
  components:
  - type: Sprite
    layers:
    - state: "comm_alt0"
    - map: ["enum.PowerDeviceVisualLayers.Powered"]
      state: "comm_alt"

- type: entity
  parent: RMCPropComputerBase
  id: RMCPersonalDesktop
  name: personal desktop
  components:
  - type: Sprite
    layers:
    - state: "terminal10"
    - map: ["enum.PowerDeviceVisualLayers.Powered"]
      state: "terminal1"

- type: entity
  parent: RMCPropComputerBase
  id: RMCSecurityCameraConsole
  name: security cameras console
  components:
  - type: Sprite
    layers:
    - state: "security_cam0"
    - map: ["enum.PowerDeviceVisualLayers.Powered"]
      state: "security_cam"

- type: entity
  parent: RMCSecurityCameraConsole
  id: RMCDropshipWeaponsConsoleProp
  name: dropship weapons controls
  components:
  - type: Sprite
    drawdepth: Objects
  - type: PointLight
    enabled: true
    radius: 1.5
    netsync: true
    energy: 1
    offset: "0,0"
    color: "#FFEFD2"
    mask: /Textures/_RMC14/Effects/LightMasks/quad_cone.png

- type: entity
  parent: RMCPoliceConsoleBase
  id: RMCSecurityRecordsConsole
  name: Jurisdictional Automated System
  description: A Weyland-Yutani terminal for preparing incident reports and calculating criminal sentences.
  components:
  - type: RMCPoliceConsole
    sentencing: true
  - type: AccessReader
    access: [["CMAccessBrig"], ["RMCAccessCommand"]]
  - type: Sprite
    layers:
    - state: "jas0"
      map: ["enum.RMCPoliceConsoleVisualLayers.Unpowered"]
    - map: ["enum.PowerDeviceVisualLayers.Powered"]
      state: "jas"
    - map: ["enum.RMCPoliceConsoleVisualLayers.Broken"]
      state: "jasb"
      visible: false

- type: entity
  parent: RMCPoliceConsoleBase
  id: RMCSecurityRecordsConsoleAlt
  name: security records
  description: Used to view and edit personnel security records.
  components:
  - type: ContainerContainer
    containers:
      PoliceScanner: !type:ContainerSlot
  - type: ItemSlots
    slots:
      PoliceScanner:
        name: rmc-police-scanner-slot
        whitelist:
          components:
          - RMCClueScanner
  - type: Sprite
    layers:
    - state: "security0"
      map: ["enum.RMCPoliceConsoleVisualLayers.Unpowered"]
    - map: ["enum.PowerDeviceVisualLayers.Powered"]
      state: "security"
    - map: ["enum.RMCPoliceConsoleVisualLayers.Broken"]
      state: "securityb"
      visible: false

- type: entity
  parent: RMCPropComputerBase
  id: RMCIdentificationComputer
