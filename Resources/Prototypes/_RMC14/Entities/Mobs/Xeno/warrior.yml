- type: entity
  parent:
    - CMXenoDeveloped
    - CMXenoTail
    - CMXenoFlammable
    - RMCXenoSpeechSounds
    - RMCXenoCommendationReceiver
    - RMCXenoMobCollision
  id: CMXenoWarrior
  name: Warrior
  description: A beefy alien with an armored carapace.
  components:
    - type: RMCKeybindActions
      actions:
        XenoPrimaryOne: [ ActionXenoPunch ]
        XenoPrimaryTwo: [ ActionXenoLunge ]
        XenoPrimaryThree: [ ActionXenoFling ]
    - type: XenoBaseCaste
    - type: GuideHelp
      guides:
        - RMCGuideRoleWarrior
    - type: Sprite
      sprite: _Stories/Mobs/Xenos/Warrior/warrior.rsi
    - type: MobState
      allowedStates:
        - Alive
        - Critical
        - Dead
    - type: MobThresholds
      thresholds:
        0: Alive
        500: Critical
        600: Dead
    # Stories-SynthHeavyGrab-Start
    - type: Tag
      tags:
        - RMCSynthGrabbable
    - type: FiremanCarriable
      canThrow: true
      carrierWhitelist:
        components:
          - STSynthHeavyGrab
    # Stories-SynthHeavyGrab-End
    - type: Xeno
      role: CMXenoWarrior
      actionIds:
        - ActionXenoRest
        - ActionXenoRegurgitate
        - ActionXenoWatch
        - ActionXenoTailStab
        - ActionXenoPunch
        - ActionXenoLunge
        - ActionXenoFling
        - ActionXenoDevolve
      tier: 2
      hudOffset: 0,0.25
      unlockAt: 540 # 9 minutes
    - type: XenoRegen
      restHealMultiplier: 1.4
    - type: XenoLight
    - type: XenoDevolve
      devolvesTo:
        - CMXenoDefender
    - type: XenoDevour
    - type: XenoPunch
      damage:
        types:
          Blunt: 27.5
    - type: XenoFling
    - type: XenoLunge
    - type: XenoPlasma
      plasma: 0
      maxPlasma: 0
      plasmaRegenOnWeeds: 0
    - type: XenoEvolution
      max: 500
      evolvesTo:
        - RMCXenoCrusher
        - CMXenoPraetorian
      strains:
        - STXenoWarriorBoxer # Stories-XenoBoxer
        - STXenoWarriorBulwark # Stories-XenoBulwark
    - type: CMArmor
      xenoArmor: 20
      explosionArmor: 40
    - type: XenoClaws
      clawType: Sharp
    - type: MeleeWeapon
      damage:
        groups:
          Brute: 35
    - type: XenoTailStab
      tailDamage:
        groups:
          Brute: 48
    - type: Tackle
      max: 4
    - type: SlowOnPull
      slowdowns:
        - multiplier: 0.4525
          whitelist:
            components:
              - Marine
        - multiplier: 0.5025
          whitelist:
            components:
              - XenoLight
        - multiplier: 0.3625
          whitelist:
            components:
              - XenoHeavy
    - type: XenoLifesteal
    - type: RMCXenoDamageVisuals
      prefix: warrior
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: warrior
    - type: IntelRecoverCorpseObjectiveOnDeath
      value: 0.2
    - type: FixedIdentity
      name: cm-job-name-xeno-warrior
    - type: RMCSurgeryXenoHeart
      item: RMCOrganXenoHeartT2
    - type: RMCActionOrder
      id: CMXenoWarrior

