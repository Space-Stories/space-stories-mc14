- type: entity
  parent: CMBaseElectronics
  id: RMCBaseDoorElectronics
  abstract: true
  components:
  - type: Item
    sprite: _RMC14/Objects/Misc/circuitboard_inhand.rsi
  - type: Tag
    tags:
    - DoorElectronics
    - RMCCircuitboard
  - type: StaticPrice
    price: 55
  - type: RMCDoorElectronics
    editorAccess: []
    requireAll: true
  - type: ActivatableUI
    key: enum.RMCDoorElectronicsUiKey.Key
    inHandsOnly: true
    requireActiveHand: false
  - type: ActivatableUIBlacklist
    blacklist:
      components:
      - Xeno
  - type: UserInterface
    interfaces:
      enum.RMCDoorElectronicsUiKey.Key:
        type: RMCDoorElectronicsBui

- type: entity
  parent: RMCBaseDoorElectronics
