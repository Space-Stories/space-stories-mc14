- type: entity
  parent: [ RMCWeaponFlamer, STHunterBaseItem ]
  id: STWeaponDefoliator
  name: heavy gel defoliator
  description: A high-power incendiary device used to rapidly expunge evidence of hives or dishonorable foes. Unsurprisingly, it is just as effective in direct combat, and lightweight enough to be fired with one hand.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Hunter/defoliator.rsi
    layers:
    - state: base
      sprite: _Stories/Objects/Weapons/Guns/Hunter/defoliator.rsi
    - state: empty
      sprite: _Stories/Objects/Weapons/Guns/Hunter/defoliator.rsi
      color: "#DD9B00"
      map: ["enum.RMCFlamerVisualLayers.Strip"]
    - state: lit
  - type: Item
    sprite: _Stories/Objects/Weapons/Guns/Hunter/defoliator.rsi
  - type: Clothing
    sprite: _Stories/Objects/Weapons/Guns/Hunter/defoliator.rsi
    slots:
    - Back
  - type: Gun
    soundGunshot:
      collection: RMCFlamerFL3Shoot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Tank
        startingItem: STDefoliatorTank
        insertSound: /Audio/_RMC14/Weapons/Guns/Flamer/wy_flamer_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Flamer/wy_flamer_unload.ogg
        priority: 2
  - type: RMCIgniter
    sound:
      path: /Audio/_RMC14/Weapons/Guns/Flamer/wy_flamer_ignite.ogg
  - type: Wieldable
  - type: WieldableSpeedModifiers
    base: 0.9
    light: 0.8
    medium: 0.7
    heavy: 0.6
  - type: AttachableHolder
    slots: {}
  - type: GunUserWhitelist
    whitelist:
      components:
      - Hunter

- type: entity
  parent: [ RMCBaseTankFlamer, STHunterBaseItem ]
  id: STDefoliatorTank
  name: gel defoliator fuel tank
  description: A high-capacity heat-resistant tank of highly-flammable gel fuel for a heavy defoliator.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Ammunition/defoliator.rsi
    state: flametank
  - type: Item
    size: Normal
  - type: RMCFlamerTank
    maxIntensity: 70
    maxRange: 8
  - type: SolutionContainerManager
    solutions:
      rmc_flamer_tank:
        maxVol: 100
        reagents:
        - ReagentId: RMCNapalmEX
          Quantity: 100
