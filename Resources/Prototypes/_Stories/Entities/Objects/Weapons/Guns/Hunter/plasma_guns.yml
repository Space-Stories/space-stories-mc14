- type: entity
  parent: STHunterBaseItem
  id: STWeaponPlasmaPistol
  name: plasma pistol
  description: A plasma pistol capable of rapid fire. It has an integrated battery. Can be used to set fires, either to braziers or on people.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Hunter/plasma_pistol.rsi
    layers:
    - state: plasma-pistol
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _Stories/Objects/Weapons/Guns/Hunter/plasma_pistol.rsi
    slots:
    - suitstorage
    - belt
  - type: Item
    size: Small
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: STPulseShotCollection
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilUnwielded: 0.1
    recoilWielded: 0
    scatterWielded: 0
    scatterUnwielded: 5
    baseFireRate: 2.2
  - type: Wieldable
  - type: ProjectileBatteryAmmoProvider
    proto: STPistolBolt
    fireCost: 1
  - type: Battery
    maxCharge: 40
    startingCharge: 40
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: STPistolBolt
      fireCost: 1
    - proto: STPistolBoltIncendiary
      fireCost: 5
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 0.75
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: GunUserWhitelist
    whitelist:
      components:
      - Hunter

- type: entity
  parent: STHunterBaseItem
  id: STWeaponPlasmaCarbine
  name: plasma carbine
  description: A short-barreled rapid-fire assault weapon only given to military caste soldiers, unsuitable for hunting actual prey. Features a deadly burst-fire mode, alongside incendiary or impact-explosive rounds. Although more accurate when wielded, it can be fired with one hand.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Hunter/plasma_carbine.rsi
    layers:
    - state: plasma-carbine
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _Stories/Objects/Weapons/Guns/Hunter/plasma_carbine.rsi
    slots:
    - suitStorage
    - Back
  - type: Item
    size: Huge
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      collection: STPulseShotCollection
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    recoilUnwielded: 5
    recoilWielded: 0.1
    scatterWielded: 2
    scatterUnwielded: 8
    baseFireRate: 3.5
  - type: Wieldable
  - type: ProjectileBatteryAmmoProvider
    proto: STPistolBoltIncendiary
    fireCost: 1
  - type: Battery
    maxCharge: 40
    startingCharge: 40
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: STPistolBoltIncendiary
      fireCost: 1
    - proto: STPlasmaBoltLethalProjectile
      fireCost: 1
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 1
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: GunUserWhitelist
    whitelist:
      components:
      - Hunter

- type: entity
  parent: STHunterBaseItem
  id: STWeaponPlasmaRifle
  name: plasma rifle
  description: A long-barreled heavy plasma weapon. Intended for combat, not hunting. Has an integrated battery that allows for a functionally unlimited amount of shots to be discharged. Equipped with an internal gyroscopic stabilizer allowing its operator to fire the weapon one-handed if desired.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Hunter/plasma_rifle.rsi
    layers:
    - state: plasma-rifle
      map: [ "enum.GunVisualLayers.Base" ]
  - type: Clothing
    sprite: _Stories/Objects/Weapons/Guns/Hunter/plasma_rifle.rsi
    slots:
    - suitStorage
    - Back
  - type: Item
    size: Huge
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/_Stories/Weapons/pred_plasma_shot.ogg
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilUnwielded: 0.3
    recoilWielded: 0
    scatterWielded: 2
    scatterUnwielded: 10
    baseFireRate: 0.8
  - type: Wieldable
  - type: ProjectileBatteryAmmoProvider
    proto: STPistolBoltIncendiary
    fireCost: 5
  - type: Battery
    maxCharge: 100
    startingCharge: 100
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 1.5
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: GunUserWhitelist
    whitelist:
      components:
      - Hunter

