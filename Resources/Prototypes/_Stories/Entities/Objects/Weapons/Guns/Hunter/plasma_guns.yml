- type: entity
  parent: STHunterBaseItem
  id: STWeaponPlasmaPistol
  name: plasma pistol
  description: A plasma pistol capable of rapid fire. It has an integrated battery. Can be used to set fires, either to braziers or on people.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Weapons/Guns/Hunter/plasma_pistol.rsi
    layers:
    - state: plasma-pistol
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WieldableVisuals.Wielded:
        base:
          True: { state: wielded-inhand-right }
          False: { state: plasma-pistol }
  - type: Clothing
    slots:
    - suitstorage
    - belt
  - type: Item
    size: Small
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: STPulseShotCollection
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilUnwielded: 0
    scatterWielded: 5
    scatterUnwielded: 7
    baseFireRate: 2
  - type: Wieldable
  - type: ProjectileBatteryAmmoProvider
    proto: STPistolBolt
    fireCost: 1
  - type: Battery
    maxCharge: 4000
    startingCharge: 4000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 100
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: GunSwitch
  - type: UniqueAction
  - type: GunUserWhitelist
    whitelist:
      components:
      - STHunterLeader
      - STHunterYoung
      - STHunter

