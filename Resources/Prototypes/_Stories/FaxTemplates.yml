    [bullet]Я понимаю, что несоблюдение границ, обозначенных как передовая оперативная база или безопасные районы, приведет к предъявлению мне обвинений.
    [bullet]Я понимаю, что это развертывание может быть отменено по усмотрению командования.
    [bullet]Я понимаю, что в случае крупной атаки на передовую оперативную базу или в случае отмены статуса безопасных зон я должен вернуться на "Алмайер" как можно скорее.

