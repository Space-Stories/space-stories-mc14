
- type: entity
  parent: CMHyperSleepChamber
  id: STWorkingJoeStorageCloset
  name: Seegson storage closet
  description: A storage closet for Working Joe synthetic units, built to keep them powered down and out of the way between shifts.
  components:
  - type: SpawnPoint
    spawn_type: Job
    job_id: STJobWorkingJoe
  - type: Sprite
    sprite: _Stories/Synth/WorkingJoe/joe_storage.rsi
    drawdepth: Mobs
    noRot: true
    layers:
    - state: empty
      map: [ "enum.HyperSleepChamberLayers.Base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CryostorageVisuals.Full:
        enum.HyperSleepChamberLayers.Base:
          True: { state: occupied }
          False: { state: empty }
  - type: InsertBlacklist
    whitelist:
      components:
      - STSynthVoiceSynthesizer
    blacklist:
      components:
      - Xeno
