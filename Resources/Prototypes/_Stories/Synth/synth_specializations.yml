# Synth specialization data, previews, and loadouts

- type: entity
  id: STSynthSpecializationGeneralData
  categories: [ HideSpawnMenu ]
  components:
  - type: STSynthSpecialization
    specialization: General
  - type: LoadoutGearProfile
    startingGear: STGearSynthSpecializationGeneral
    managedSlots: &stSynthSpecializationManagedSlots
    - jumpsuit
    - head
    - shoes
    - gloves
    - outerClothing
    - mask
    - eyes
    - belt
    - back
    preserveSlots: &stSynthSpecializationPreserveSlots
    - id
    - ears
    - pocket1
    - pocket2
    - suitstorage

