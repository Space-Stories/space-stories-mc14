- type: job
  parent: RMCSyntheticColony
  id: STSyntheticColonyGeneral
  startingGear: STGearSyntheticColonistPreset
  spawnMenuRoleName: Colony Synth (General Survivor)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      preset: RMCLanguagePresetSynthColonist
    - type: LanguageLearning
      preset: RMCLanguageLearningPresetSynthColonist
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: synth
    - type: NpcFactionMember
      factions:
      - Civilian
    - type: IntelRescueSurvivorObjective
    - type: RMCSurvivor
    - type: MotionDetectorTracked
    - type: EquipSurvivorPreset
      preset: STSurvivorPresetSynthColonyGeneral
    - type: SynthGeneration
      generation: RMCSynthGenTwo
      selectable: false
    - type: Synth
  useLoadoutOfJob: RMCSyntheticColony

- type: startingGear
  id: STGearSyntheticColonistPreset
  equipment:
    id: RMCIDCardSynthColony
    ears: CMHeadsetColony
    pocket1: RMCPouchSurvivalSynthFill
    pocket2: RMCPouchToolsFill

