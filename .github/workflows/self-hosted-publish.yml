name: Self Hosted Publish

concurrency:
  group: publish

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v3.6.0
      with:
        submodules: 'recursive'

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Apply build patch
      if: ${{ secrets.SECRET_PATCH != '' }}
      env:
        SECRET_PATCH: ${{ secrets.SECRET_PATCH }}
      shell: bash
      run: |
        echo "$SECRET_PATCH" | base64 -d > patch.diff
        git apply patch.diff
        rm patch.diff

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release /m
      env:
        version: 1

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform linux-x64 --platform osx-x64 --platform linux-arm64
      env:
        version: 1

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release
      env:
        version: 1

    - name: Fetch tags for RobustToolbox
      run: |
        cd RobustToolbox
        git fetch --tags --force

    - name: Publish version
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

    - name: Publish changelog (Discord)
      run: Tools/actions_changelogs_since_last_run.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}

    - name: Publish changelog (RSS)
      run: Tools/actions_changelog_rss.py
      env:
        CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}

    - name: Clean workspace
      if: always()
      shell: bash
      run: |
        git checkout .
        git clean -fd

